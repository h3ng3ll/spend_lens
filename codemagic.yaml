workflows:
  upload_to_internal_test_aab:
    name: Upload to Internal Test AAB
#    instance_type: linux
    max_build_duration: 15
    environment:
      groups:
        - google_credentials
        - android_credentials
        - purchase
      flutter: 3.44.4
    scripts:
      - name: Create firebase.json file
        script: |
          echo "$FIREBASE_JSON" > "$CM_BUILD_DIR/firebase.json"
          echo "firebase.json contents:"
          cat "$CM_BUILD_DIR/firebase.json"
      - name: Create firebase_options.dart file
        script: |
          echo "$FIREBASE_OPTIONS" > "$CM_BUILD_DIR/lib/firebase_options.dart"
          echo "firebase_options.dart contents:"
          cat "$CM_BUILD_DIR/lib/firebase_options.dart"
      - name: Create google-services.json file
        script: |
          echo "$GOOGLE_SERVICES_JSON" > "$CM_BUILD_DIR/android/app/google-services.json"
          echo "google-services.json contents:"
          cat "$CM_BUILD_DIR/android/app/google-services.json"
      - name: Restore key
        script: |
          echo "$KEY_PROPERTY" > android/key.properties
          echo  "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          pwd
          ls -la android/key.properties
          ls -la android/app/upload-keystore.jks
      - name: Clean Flutter project
        script: |
          flutter clean
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Flutter build appbundle
        script: |
          flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/
    publishing:
      google_play:

        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS

        track: internal

        release_name: Test AAB
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: file_sharing_plus
    environment:
      groups:
        - general
        - google_credentials
        - purchase
        - apple_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: "com.hengell.spendlens"
      vars:
        BUNDLE_ID: "com.hengell.spendlens"
        APP_STORE_APPLE_ID: $APPSTORE_APP_ID
      flutter: 3.44.4
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install FlutterFire CLI
        script: |
          dart pub global activate flutterfire_cli
          export PATH="$PATH:$HOME/.pub-cache/bin"
      - name: Check key validity
        script: |
          echo "$APPSTORE_P8" > /tmp/key.p8
          openssl pkey -in /tmp/key.p8 -check -noout
      - name: Restore .env
        script: |
          echo "GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID
                GOOGLE_IOS_CLIENT_ID=$GOOGLE_IOS_CLIENT_ID
                GOOGLE_IOS_REVERSED_CLIENT_ID=$GOOGLE_IOS_REVERSED_CLIENT_ID
                REVENUE_CAT_KEY=$REVENUE_CAT_KEY
                APPHUD_APP_STORE_API_KEY=$APPHUD_APP_STORE_API_KEY
                APPHUD_GOOGLE_PLAY_API_KEY=$APPHUD_GOOGLE_PLAY_API_KEY
                FREE_RECEIPT_LIMIT=$FREE_RECEIPT_LIMIT" > .env
      - name: Create firebase.json file
        script: |
          echo "$FIREBASE_JSON" > "$CM_BUILD_DIR/firebase.json"
          echo "firebase.json contents:"
          cat "$CM_BUILD_DIR/firebase.json"
      - name: Create firebase_options.dart file
        script: |
          echo "$FIREBASE_OPTIONS" > "$CM_BUILD_DIR/lib/firebase_options.dart"
          echo "firebase_options.dart contents:"
          cat "$CM_BUILD_DIR/lib/firebase_options.dart"
      - name: Create GoogleService-Info.plist file
        script: |
          echo "$GOOGLE_SERVICE_INFO_PLIST" > "$CM_BUILD_DIR/ios/Runner/GoogleService-Info.plist"
          echo "GoogleService-Info.plist contents:"
          cat "$CM_BUILD_DIR/ios/Runner/GoogleService-Info.plist"
      - name: Detach Xcode project from any developer account
        script: |
          # Remove account-specific signing keys so Codemagic resolves the
          # team itself via the App Store Connect API key + Apple Developer
          # account (use-profiles below). Done on CI only — local dev keeps
          # its own signing. macOS BSD sed.
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          for KEY in DEVELOPMENT_TEAM CODE_SIGN_IDENTITY PROVISIONING_PROFILE PROVISIONING_PROFILE_SPECIFIER; do
            COUNT=$(grep -Ec "^[[:space:]]*$KEY = [^;]*;" "$PBXPROJ" 2>/dev/null || true)
            sed -i '' -E "/^[[:space:]]*$KEY = [^;]*;[[:space:]]*$/d" "$PBXPROJ"
            echo "  Removed $KEY (${COUNT:-0} occurrence(s))"
          done
          sed -i '' -E 's/CODE_SIGN_STYLE = [^;]*;/CODE_SIGN_STYLE = Automatic;/g' "$PBXPROJ"
          echo "  Forced CODE_SIGN_STYLE = Automatic"
      - name: Set up provisioning profiles settings on Xcode project
        script: xcode-project use-profiles --verbose
      - name: Clean Flutter project
        script: |
          flutter clean
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
      - name: View keys
        script: |
          echo "KEY_ID=$APPSTORE_KEY_ID"
          echo "ISSUER_ID=$APPSTORE_ISSUER_ID"

          echo "PRIVATE KEY length: ${#APP_STORE_CONNECT_PUBLISHER_PRIVATE_KEY}"

          printf '%s' "$APP_STORE_CONNECT_PUBLISHER_PRIVATE_KEY" | head -c 40
          echo
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        api_key: $APPSTORE_P8
        key_id: $APPSTORE_KEY_ID
        issuer_id: $APPSTORE_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
  upload_ios_metadata:
    name: Upload iOS metadata
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: 16.2
      groups:
        - apple_credentials
      vars:
        IOS_BUNDLE_ID: "com.hengell.spendlens"
        APP_NAME: $APPSTORE_APP_NAME
    scripts:
      - name: Print working dir & contents
        script: |
          echo "PWD: $(pwd)"
          ls -R
      - name: Install Ruby dependencies
        script: |
          bundle install || bundle install --path vendor/bundle
          gem install fastlane-plugin-appicon || true
      - name: Validate metadata directory structure
        script: |
          echo "===== Validating Metadata ====="
          if [ ! -d "./fastlane/metadata" ]; then
            echo "ERROR: Metadata directory not found at ./fastlane/metadata"
            exit 1
          fi
          if [ ! -d "./fastlane/metadata/en-US" ]; then
            echo "ERROR: No en-US metadata folder found in ./fastlane/metadata"
            exit 1
          fi
          echo "Scanning metadata locales..."
          find ./fastlane/metadata -maxdepth 1 -type d | grep -v "^./fastlane/metadata$" | grep -v "review_information" | sort | while read LOCALE_DIR; do
            LOCALE=$(basename "$LOCALE_DIR")
            echo "Processing metadata locale: $LOCALE"
            REQUIRED_FILES=("name.txt" "description.txt" "keywords.txt")
            MISSING=0
            for FILE in "${REQUIRED_FILES[@]}"; do
              if [ ! -f "$LOCALE_DIR/$FILE" ]; then
                echo "  - WARNING: $FILE is missing in $LOCALE"
                MISSING=$((MISSING+1))
              fi
            done
            if [ $MISSING -eq 0 ]; then
              echo "  - All required files present in $LOCALE"
            else
              echo "  - $MISSING required files missing in $LOCALE"
            fi
          done
          REQUIRED_FILES=("name.txt" "description.txt" "keywords.txt" "privacy_url.txt" "support_url.txt")
          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "./fastlane/metadata/en-US/$FILE" ]; then
              echo "ERROR: Required metadata file ./fastlane/metadata/en-US/$FILE is missing"
              exit 1
            fi
          done
          LANGUAGE_FOLDERS=$(find ./fastlane/metadata -maxdepth 1 -type d | grep -v "^./fastlane/metadata$" | grep -v "review_information" | wc -l)
          echo "Found $LANGUAGE_FOLDERS language folders in metadata"
          if [ -d "./fastlane/metadata/review_information" ]; then
            echo "Review information folder found"
            REVIEW_FILES=$(find "./fastlane/metadata/review_information" -type f | wc -l)
            echo "Found $REVIEW_FILES files in review_information"
          else
            echo "WARNING: No review_information folder found - this might be needed for new app submissions"
          fi
          echo "Metadata validation successful!"
      - name: Upload metadata via fastlane deliver
        script: |
          bundle exec fastlane ios upload_metadata
    artifacts:
      - fastlane/logs/**/*

