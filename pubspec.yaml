name: spend_lens
description: "SpendLens — receipt expense analyzer."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  bloc: ^9.0.1
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0

  # DI / functional
  get_it: ^9.2.1
  dartz: ^0.10.1
  rxdart: ^0.28.0
  collection: ^1.19.1

  # Models / codegen
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Routing
  go_router: ^17.1.0

  # Persistence
  hive_ce: ^2.18.0
  hive_ce_flutter: ^2.3.4
  path_provider: ^2.1.5

  # Camera / OCR
  camera: ^0.11.0+2
  google_mlkit_text_recognition: ^0.17.1
  google_mlkit_document_scanner: ^0.5.0
  image: ^4.3.0
  permission_handler: ^12.0.1
  device_info_plus: ^13.1.0
  image_picker: ^1.2.0

  # Export / share
  share_plus: ^13.0.0
  csv: ^6.0.0
  file_picker: ^12.2.0
  pdf: ^3.11.3
  printing: ^5.13.4

  # Subscriptions
  # ⛔ NO SINGLE VERSION BUILDS BOTH PLATFORMS ON THIS TOOLCHAIN. Verified by
  # building each, not by reading changelogs:
  #
  #   3.4.0  Android BUILDS (0 errors) · iOS FAILS
  #          -> ApphudSDK 4.4.9 references Product.PurchaseOption
  #             .billingPlanType, an iOS 26.4 StoreKit symbol absent from the
  #             iOS 26.2 SDK in Xcode 26.3. `if #available(iOS 26.4)` defers
  #             RUNTIME execution; the symbol must still resolve at COMPILE
  #             time. ApphudSDK <= 4.1.5 is clean, >= 4.2.0 is not.
  #   3.1.2  iOS BUILDS (ApphudSDK 4.0.4, clean) · Android FAILS
  #          -> its Kotlin plugin does not resolve its own handler classes.
  #   3.2.0  fails BOTH: Android handlers fixed, but ApphudSDK 4.2.2 already
  #          references the iOS 26.4 symbol.
  #
  # Holding 3.4.0: Android is the platform verified end-to-end on a device
  # this session, and iOS is unblocked by installing an Xcode that ships the
  # iOS 26.4+ SDK — a toolchain update, not a code change. Revisit then.
  apphud: ^3.4.0

  # Firebase (Crashlytics + auth + Firestore record sync + receipt-photo storage)
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  firebase_crashlytics: ^5.2.0
  cloud_firestore: ^6.1.1
  firebase_storage: ^13.0.5

  # Sync support: connectivity gives the sync UI a PROACTIVE offline signal
  # (rather than only learning of it from a failed Firestore write), and a
  # reconnect trigger. Receipt photos are compressed before upload so the
  # cloud quota is meaningful and the reported usage is measured, not guessed.
  connectivity_plus: ^7.0.0
  flutter_image_compress: ^2.4.0

  # Sign-in
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.0.0
  crypto: ^3.0.7

  # UI / misc
  intl: ^0.20.2
  gap: ^3.0.1
  flutter_svg: ^2.2.1
  flutter_dotenv: ^6.0.1
  package_info_plus: ^10.1.0
  url_launcher: ^6.3.2
  flutter_native_splash: ^2.4.6
  flutter_gen: ^5.12.0
  purchases_flutter: ^10.12.0
  purchases_ui_flutter: ^10.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  freezed: ^3.2.3
  json_serializable: ^6.9.5
  go_router_builder: ^4.2.0
  hive_ce_generator: ^1.11.0
  flutter_gen_runner: ^5.12.0
  flutter_launcher_icons: ^0.14.4

  # design_spendlens.md §9 bug 6: these belong in dev_dependencies, not
  # dependencies — the template had them wrong.
  mocktail: ^1.0.4
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/legal/
    - assets/launcher/
    - assets/splash/
    - path: .env
      platforms:
        - ios
        - android

# PLACEHOLDER app icon + native splash (design_spendlens.md §12 — real assets
# are a user-supplied item, not yet provided). `assets/launcher/icon.png` /
# `icon_foreground.png` / `icon_background.png` and
# `assets/splash/splash_glyph.png` are generated placeholders: a receipt
# glyph in the app's own accent gradient (AppColors.accentDark/accent2Dark),
# NOT the stock Flutter logo and NOT another product's artwork. Replace all
# four source PNGs with the real design assets when supplied, then re-run
# both generators below.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/launcher/icon.png"
  # Android adaptive icon (API 26+) — a flat dark background matching the
  # app's dark default (AppColors.bgDark, #0A0E1F) behind an inset,
  # gradient-filled glyph, so the OS mask never clips the artwork.
  adaptive_icon_background: "assets/launcher/icon_background.png"
  adaptive_icon_foreground: "assets/launcher/icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true

# CHRONIC BUG GUARD (`db:android12-splash-icon-falls-back-to-stock-flutter-
# launcher-icon`, 9/10 sessions): Android 12+ ignores the pre-31
# drawable*/launch_background.xml path entirely and falls back to
# `@mipmap/ic_launcher` unless `android_12.image` is set explicitly — so
# BOTH the base `image` AND `android_12.image` are configured below, never
# just one. `color`/`color_dark` match AppColors.bgDark in both branches
# (`sig:native-launch-background-is-template-white-in-a-dark-only-app`) —
# this app ships dark-only, so light and dark splash colors are identical by
# design, not an oversight.
flutter_native_splash:
  color: "#0A0E1F"
  color_dark: "#0A0E1F"
  image: assets/splash/splash_glyph.png
  image_dark: assets/splash/splash_glyph.png
  android_12:
    color: "#0A0E1F"
    color_dark: "#0A0E1F"
    image: assets/splash/splash_glyph.png
    image_dark: assets/splash/splash_glyph.png
  android: true
  ios: true
  web: false
