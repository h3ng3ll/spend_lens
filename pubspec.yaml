name: spend_lens
description: "SpendLens — receipt expense analyzer."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  bloc: ^9.0.1
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0

  # DI / functional
  get_it: ^9.2.1
  dartz: ^0.10.1
  rxdart: ^0.28.0
  collection: ^1.19.1

  # Models / codegen
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Routing
  go_router: ^17.1.0

  # Persistence
  hive_ce: ^2.18.0
  hive_ce_flutter: ^2.3.4
  path_provider: ^2.1.5

  # Camera / OCR
  camera: ^0.11.0+2
  google_mlkit_text_recognition: ^0.17.1
  google_mlkit_document_scanner: ^0.5.0
  image: ^4.3.0
  permission_handler: ^12.0.1
  device_info_plus: ^13.1.0

  # Export / share
  share_plus: ^13.0.0
  csv: ^6.0.0
  file_picker: ^12.2.0
  pdf: ^3.11.3
  printing: ^5.13.4

  # Subscriptions
  apphud: ^3.4.0

  # Firebase (Crashlytics + optional auth only)
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  firebase_crashlytics: ^5.2.0

  # Sign-in
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.0.0
  crypto: ^3.0.7

  # UI / misc
  intl: ^0.20.2
  gap: ^3.0.1
  flutter_svg: ^2.2.1
  flutter_dotenv: ^6.0.1
  package_info_plus: ^10.1.0
  url_launcher: ^6.3.2
  flutter_native_splash: ^2.4.6
  flutter_gen: ^5.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  freezed: ^3.2.3
  json_serializable: ^6.9.5
  go_router_builder: ^4.2.0
  hive_ce_generator: ^1.11.0
  flutter_gen_runner: ^5.12.0
  flutter_launcher_icons: ^0.14.4

  # design_spendlens.md §9 bug 6: these belong in dev_dependencies, not
  # dependencies — the template had them wrong.
  mocktail: ^1.0.4
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - path: .env
      platforms:
        - ios
        - android
